services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx-certs:/etc/nginx/certs:ro,z
    depends_on:
      - app

  app:
    build: .
    environment:
      - APP_NAME=App

  # Cloudflare Quick Tunnel container 
  tunnel:
    image: cloudflare/cloudflared:latest
    # Directs incoming public HTTPS traffic directly to NGINX over port 80 inside Docker's network
    command: tunnel --url http://nginx:80
    depends_on:
      - nginx