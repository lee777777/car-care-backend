services:
  app:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"   # High port for unprivileged rootless Podman
      - "8443:443"  # High port for HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./letsencrypt:/etc/nginx/certs:ro,z
    depends_on:
      - app

  localtunnel:
    image: efrecon/localtunnel
    restart: always
    environment:
      # Disables Node.js strict SSL verification inside the tunnel container
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    # Connects to NGINX over HTTP (port 80) and requests a custom subdomain
    command: --host https://localtunnel.me --local-host nginx --port 80 --subdomain car-care-api
    depends_on:
      - nginx