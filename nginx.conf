worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    keepalive_timeout 65;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Extract real client IP through Cloudflare
    map $http_cf_connecting_ip $real_client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    # Exclude OPTIONS preflight requests from rate limiting
    map $request_method $limit_key {
        default $real_client_ip;
        OPTIONS "";
    }

    limit_req_zone $limit_key zone=req_limit_zone:10m rate=10r/s;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        http2 on;
        server_name api-carecare.duckdns.org;

        ssl_certificate /etc/nginx/certs/live/api-carecare.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/api-carecare.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # CORS Headers for Vercel Frontend
        # Replace 'https://your-app.vercel.app' with your actual Vercel domain (or use '$http_origin')
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        location / {
            # Handle Preflight OPTIONS requests instantly
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=req_limit_zone burst=30 nodelay;

            set $upstream_backend http://app:3000;
            proxy_pass $upstream_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering off;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name api-carecare.duckdns.org;

        location / {
            return 301 https://$host$request_uri;
        }
    }
}