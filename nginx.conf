worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    keepalive_timeout 65;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Internal Podman DNS resolver
    # resolver 127.0.0.11 valid=10s ipv6=off;

    # Extract real client IP
    map $http_cf_connecting_ip $real_client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    # Exclude OPTIONS preflight requests from rate limiting
    map $request_method $limit_key {
        default $real_client_ip;
        OPTIONS "";
    }

    limit_req_zone $limit_key zone=req_limit_zone:10m rate=10r/s;

    server {
        listen 80;
        listen [::]:80;
        
        # Match local requests and LocalTunnel domain
        server_name localhost nginx_proxy *.loca.lt;

        # CORS Headers for Vercel Frontend
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,bypass-tunnel-reminder' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

       location / {
          if ($request_method = 'OPTIONS') {
           add_header 'Access-Control-Allow-Origin' '$http_origin' always;
           add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
           add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,bypass-tunnel-reminder' always;
           add_header 'Access-Control-Max-Age' 1728000;
           add_header 'Content-Type' 'text/plain; charset=utf-8';
           add_header 'Content-Length' 0;
            return 204;
           }

         limit_req zone=req_limit_zone burst=30 nodelay;

    # Direct proxy pass without variable declaration
         proxy_pass http://app:3000;

         proxy_http_version 1.1;
         proxy_set_header Connection "";

         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $real_client_ip;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;

         proxy_connect_timeout 5s;
         proxy_send_timeout 60s;
         proxy_read_timeout 60s;

         proxy_buffering off;

    # Bypass LocalTunnel landing page
         proxy_set_header bypass-tunnel-reminder "true";
        }
    }
}