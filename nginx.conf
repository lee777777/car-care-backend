worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Payload size limit (Allows uploads up to 10MB)
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    keepalive_timeout 65;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Docker internal DNS server (Re-queries every 10s for container scaling)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Fallback IP detection: Uses Cloudflare IP first, falls back to direct remote IP
    map $http_cf_connecting_ip $real_client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    # Exclude CORS OPTIONS preflights from rate limiting
    map $request_method $limit_key {
        default $real_client_ip;
        OPTIONS "";
    }

    # Rate limiting zone (5 req/s per client IP)
    limit_req_zone $limit_key zone=req_limit_zone:10m rate=5r/s;

    # HTTPS Gateway
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        http2 on;

        server_name api.care-care.com;

        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=req_limit_zone burst=20 nodelay;

            # Direct domain variable forces dynamic DNS lookups across scaled containers
            set $upstream_backend http://app:3000;
            proxy_pass $upstream_backend;

            proxy_http_version 1.1;

            # Allows connection reuse between NGINX and Node.js
            proxy_set_header Connection "";

            # Reroute request if a container instance crashes or times out
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;

            # Pass true client IP and headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Disable buffering for real-time API responses
            proxy_buffering off;
        }
    }

    # HTTP to HTTPS Redirection
    server {
        listen 80;
        listen [::]:80;
        server_name api.care-care.com;

        location / {
            return 301 https://$host$request_uri;
        }
    }
}