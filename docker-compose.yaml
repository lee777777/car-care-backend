services:
  app:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "8080:80"   # High port for unprivileged rootless Podman
      - "8443:443"  # High port for HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./letsencrypt:/etc/nginx/certs:ro,z
    depends_on:
      - app

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: always
    # Connects internally to NGINX over HTTPS on port 443
    command: tunnel --no-tls-verify --url https://nginx:443
    depends_on:
      - nginx